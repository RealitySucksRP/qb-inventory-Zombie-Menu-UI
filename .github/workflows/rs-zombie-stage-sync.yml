name: RS Zombie Stage Sync

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Zombie staging branch
        uses: actions/checkout@v4
        with:
          ref: source-update-zombie-v3.0.2
          fetch-depth: 0

      - name: Build exact Zombie v3.0.2 server main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/rs-punk
          git clone --depth 1 --branch main https://github.com/RealitySucksRP/qb-inventory-reworked-images-in-menu.git /tmp/rs-punk
          cp /tmp/rs-punk/server/main.lua server/main.lua
          patch --batch -p0 < .rs-update/server-main.patch
          test "$(git hash-object server/main.lua)" = "df3f6303ece5ccf3157af5de12fa6f231e21897f"

      - name: Commit exact Zombie server main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "RealitySucksRP Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/main.lua
          if git diff --cached --quiet; then
            echo "Zombie server main already matches."
            exit 0
          fi
          git commit -m "Update Zombie inventory server main to v3.0.2"
          git push origin HEAD:source-update-zombie-v3.0.2

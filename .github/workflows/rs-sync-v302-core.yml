name: RS Sync Zombie v3.0.2 Core

on:
  push:
    branches:
      - source-update-zombie-v3.0.2

permissions:
  contents: write

jobs:
  sync-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Zombie staging branch
        uses: actions/checkout@v4
        with:
          ref: source-update-zombie-v3.0.2
          fetch-depth: 0

      - name: Fetch verified shared core from RS Punk
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/RealitySucksRP/qb-inventory-reworked-images-in-menu.git /tmp/rs-punk

          mkdir -p client server locales html
          cp /tmp/rs-punk/client/main.lua client/main.lua
          cp /tmp/rs-punk/client/drops.lua client/drops.lua
          cp /tmp/rs-punk/client/vehicles.lua client/vehicles.lua
          cp /tmp/rs-punk/server/functions.lua server/functions.lua
          cp /tmp/rs-punk/server/sessions.lua server/sessions.lua
          cp /tmp/rs-punk/server/commands.lua server/commands.lua
          cp /tmp/rs-punk/server/compat.lua server/compat.lua
          cp /tmp/rs-punk/locales/en.lua locales/en.lua

          rm -rf html/vendor
          cp -a /tmp/rs-punk/html/vendor html/vendor

      - name: Commit shared v3 core
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "RealitySucksRP Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add client server/functions.lua server/sessions.lua server/commands.lua server/compat.lua locales/en.lua html/vendor
          if git diff --cached --quiet; then
            echo "Shared core already matches."
            exit 0
          fi
          git commit -m "Sync Zombie inventory shared v3.0.2 core"
          git push origin HEAD:source-update-zombie-v3.0.2
